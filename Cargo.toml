[workspace]
members = ["apps/afterglow", "apps/glint", "crates/core", "crates/media", "crates/shell", "crates/ui"]
resolver = "3"

[workspace.package]
version = "0.3.0-beta.1"
edition = "2024"
repository = "https://github.com/nitreojs/glint"

[workspace.dependencies]
glint-core = { path = "crates/core" }
glint-media = { path = "crates/media" }
glint-shell = { path = "crates/shell" }
glint-ui = { path = "crates/ui" }
color_quant = "1.1.0"
embed-resource = "3.0.12"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
emath = "0.37.0"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
minisign-verify = "0.3.0"
raw-window-handle = "0.6.2"
regex-lite = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
windows = { version = "0.62.2", features = ["Win32_Devices_Display", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_UI_Controls", "Win32_UI_Shell_Common", "Win32_Media", "Win32_Graphics_Imaging", "Win32_System_DataExchange", "Win32_System_Memory"] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
